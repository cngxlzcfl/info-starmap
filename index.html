<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信息星图 · 今晚的世界长这样</title>
<style>
:root{
  --bg:#060913;
  --bg2:#0d1326;
  --ink:#e9edff;
  --muted:#8a93b8;
  --rule:rgba(160,175,255,.14);
  --accent:#7d9bff;
  --accent2:#ffb86b;
  --panel:rgba(13,19,38,.82);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  overflow:hidden;
}
#sky{position:fixed;inset:0;display:block;cursor:grab}
#sky.dragging{cursor:grabbing}

/* ---------- 顶部 ---------- */
.masthead{position:fixed;top:22px;left:26px;z-index:5;pointer-events:none;max-width:min(560px,80vw)}
.masthead h1{
  font-size:26px;font-weight:800;letter-spacing:.14em;
  background:linear-gradient(92deg,var(--ink),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.masthead .sub{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.7}
.masthead .sub b{color:var(--accent2);font-weight:600}

/* ---------- 图例 ---------- */
.legend{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:5;display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;
  max-width:min(860px,94vw);pointer-events:none;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 11px;border:1px solid var(--rule);border-radius:999px;
  background:var(--panel);backdrop-filter:blur(8px);
  font-size:12px;color:var(--ink);cursor:pointer;user-select:none;
  transition:opacity .2s,border-color .2s;pointer-events:auto;
}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .n{color:var(--muted);font-size:11px}
.chip:hover{border-color:var(--accent)}
.chip.off{opacity:.32}
.chip.solo{border-color:var(--accent2)}

/* ---------- 悬浮故事卡 ---------- */
.card{
  position:fixed;z-index:8;width:320px;max-width:calc(100vw - 24px);
  background:var(--panel);backdrop-filter:blur(12px);
  border:1px solid var(--rule);border-radius:14px;
  padding:14px 16px;pointer-events:none;
  opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.card.show{opacity:1;transform:translateY(0)}
.card .t{font-size:14.5px;font-weight:700;line-height:1.55;margin-bottom:8px}
.card .t a{color:var(--ink);text-decoration:none}
.card .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.card .badge{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.card .badge.src{color:var(--bg);border:none;font-weight:700}
.card .badge.fit{color:var(--accent2);border-color:rgba(255,184,107,.4)}
.card .badge.intel{color:var(--accent2);border-color:rgba(255,184,107,.45)}
.card .m{font-size:12.5px;color:var(--muted);line-height:1.75;margin-bottom:8px}
.card .cmt{font-size:12px;color:var(--accent);line-height:1.7}
.card .hint{margin-top:10px;font-size:11px;color:var(--muted);opacity:.75}

/* ---------- 数据面板 ---------- */
.panel{
  position:fixed;top:18px;right:18px;z-index:6;width:340px;max-width:calc(100vw - 24px);
  background:var(--panel);backdrop-filter:blur(12px);
  border:1px solid var(--rule);border-radius:14px;overflow:hidden;
  transform:translateX(calc(100% + 26px));transition:transform .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.panel.open{transform:translateX(0)}
.panel .head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--rule)}
.panel .head b{font-size:13px;letter-spacing:.08em}
.panel .head button{
  background:none;border:1px solid var(--rule);color:var(--muted);border-radius:8px;
  padding:3px 10px;font-size:12px;cursor:pointer;
}
.panel .head button:hover{color:var(--ink);border-color:var(--accent)}
.panel .body{padding:12px 14px 16px;max-height:calc(100vh - 120px);overflow-y:auto}
.panel h4{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 8px;letter-spacing:.06em}
.bright{list-style:none}
.bright li{margin:7px 0}
.bright a{
  display:flex;gap:8px;align-items:baseline;text-decoration:none;
  font-size:12.5px;color:var(--ink);line-height:1.5;
}
.bright a:hover .tt{color:var(--accent2)}
.bright .rk{color:var(--accent2);font-weight:700;flex:none;font-size:12px}
.bright .tt{flex:1;transition:color .15s}
.bright .ht{color:var(--muted);font-size:11px;flex:none}
.perr{font-size:11px;color:#e0728f;line-height:1.6;margin-top:10px}

/* ---------- 面板开关 ---------- */
.fab{
  position:fixed;top:18px;right:18px;z-index:5;
  background:var(--panel);backdrop-filter:blur(8px);
  border:1px solid var(--rule);color:var(--ink);border-radius:10px;
  padding:8px 14px;font-size:12.5px;cursor:pointer;letter-spacing:.06em;
}
.fab:hover{border-color:var(--accent)}
#fabLang{right:112px}
#fabSound{right:206px}
#fabRadio{right:300px}
body.panel-open .fab{opacity:0;pointer-events:none}

/* ---------- 电台字幕条 ---------- */
.radio{
  position:fixed;left:18px;bottom:18px;z-index:7;max-width:min(520px,80vw);
  display:flex;align-items:center;gap:10px;
  background:var(--panel);backdrop-filter:blur(10px);
  border:1px solid var(--rule);border-radius:12px;
  padding:10px 14px;font-size:12.5px;line-height:1.7;color:var(--ink);
  opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;
  pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.radio.show{opacity:1;transform:translateY(0);pointer-events:auto}
.radio .live{color:var(--accent2);font-weight:700;flex:none;letter-spacing:.05em}
.radio .tx{flex:1;color:var(--ink)}
.radio button{
  flex:none;background:none;border:1px solid var(--rule);color:var(--muted);
  border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;
}
.radio button:hover{color:var(--ink);border-color:var(--accent)}

/* ---------- 底部提示 ---------- */
.hintbar{
  position:fixed;right:18px;bottom:18px;z-index:5;
  font-size:11px;color:var(--muted);text-align:right;line-height:1.8;
  pointer-events:none;opacity:.85;
}
.hintbar em{font-style:normal;color:var(--accent)}

@media (max-width:640px){
  .masthead{top:14px;left:16px}
  .masthead h1{font-size:20px}
  .hintbar{display:none}
  .panel{top:12px;right:12px;left:12px;width:auto}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<header class="masthead">
  <h1>信息星图</h1>
  <div class="sub" id="sub">正在点亮夜空……</div>
</header>

<button class="fab" id="fabLang">译成中文</button>
<button class="fab" id="fabSound">音效·关着</button>
<button class="fab" id="fabRadio">电台</button>
<button class="fab" id="fab">数据面板</button>

<aside class="panel" id="panel">
  <div class="head"><b>今晚的星象统计</b><button id="closePanel">收起</button></div>
  <div class="body">
    <h4>各信息源今晚进账（条）</h4>
    <figure class="chart-figure" style="margin:.4rem 0 0">
      <div id="chart-src" style="width:100%;min-height:230px"></div>
    </figure>
    <div class="perr" id="intelNote" style="color:var(--accent2)"></div>
    <h4 id="evHead">今晚大事件（点名字飞过去看）</h4>
    <ol class="bright" id="events"></ol>
    <h4>今晚最亮的星（点名字飞过去看）</h4>
    <ol class="bright" id="bright"></ol>
    <div class="perr" id="perr"></div>
  </div>
</aside>

<div class="legend" id="legend"></div>

<div class="card" id="card">
  <div class="t" id="cardT"></div>
  <div class="badges" id="cardB"></div>
  <div class="m" id="cardM"></div>
  <div class="cmt" id="cardC"></div>
  <div class="hint">点这颗星 → 去看原文；拖动夜空漫游，滚轮拉近拉远</div>
</div>

<div class="hintbar">
  悬停星星<b>听它讲今天的故事</b><br>
  <em>拖动</em> 漫游 · <em>滚轮</em> 缩放 · <em>点击</em> 看原文
</div>

<div class="radio" id="radioBar">
  <span class="live">● 播报中</span>
  <span class="tx" id="radioText"></span>
  <button id="radioStop">停</button>
</div>

<script src="./_shared/js/echarts.min.js"></script>
<script src="assets/stardata.js?v=15"></script>
<script src="assets/events.js?v=15"></script>
<script>
/* 时光机暗道：网址带 ?d=日期 时改吃那晚的历史快照；快照缺失自动弹回今晚 */
(function(){
  var m = location.search.match(/[?&]d=(\d{4}-\d{2}-\d{2})/);
  if (!m) return;
  document.write('<script src="assets/history/stardata-' + m[1] + '.js"><\/script>');
  document.write('<script src="assets/history/events-' + m[1] + '.js"><\/script>');
  document.write('<script>if(!(window.STARDATA&&String(window.STARDATA.date||"").indexOf("' + m[1] + '")===0))location.replace(location.pathname);<\/script>');
})();
</script>
<script src="assets/starmap.js?v=9"></script>
<script src="assets/charts.js?v=7"></script>
<script src="assets/sound.js?v=1"></script>
<script>window.RADIO_AUDIO = "assets/radio.mp3?v=5";</script>
<script src="assets/radio.js?v=6"></script>
<script src="assets/history_manifest.js"></script>
<script src="assets/timemachine.js?v=1"></script>
</body>
</html>
